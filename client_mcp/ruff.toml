# Ruff configuration for Client-MCP project
# https://docs.astral.sh/ruff/

# Exclude legacy files and cache directories
extend-exclude = [
    "main.py",           # Legacy file
    "main_new.py",       # Legacy file
    "tests/test_*.py",   # Legacy test files (except test_official_sdk.py)
    "__pycache__",
    ".ruff_cache",
]

# Line length
line-length = 120

# Target Python version
target-version = "py312"

[lint]
# Enable specific rule categories
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
]

# Ignore specific rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B904",   # Use raise from to avoid exception chaining (legacy code)
]

[lint.per-file-ignores]
# Allow certain violations in test files
"tests/test_official_sdk.py" = ["F841"]  # Unused variable in tests

[format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Line endings
line-ending = "auto"
