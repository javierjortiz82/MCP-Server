[project]
name = "smartbot-mcp-client"
version = "2.1.0"
description = "SmartBot - Official MCP Client with Google GenAI Integration"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",           # Official MCP SDK from Anthropic
    "google-genai>=1.38.0", # Google GenAI for LLM
    "gemini-agent",         # Local Gemini Agent library (from ../agent)
    "anyio>=4.0.0",         # Async IO support
    "httpx>=0.27.0",        # HTTP client (used by MCP SDK)
    "aiolimiter>=1.1.0",    # Async rate limiting (Leaky Bucket)
    "pydantic>=2.11.0",     # Data validation and settings management
    "pydantic-settings>=2.11.0",  # Settings management from .env
    "psycopg2-binary>=2.9.0",  # PostgreSQL database adapter for pagination persistence
    "python-dotenv>=1.0.0", # Load environment variables from .env
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",  # Code coverage reporting
]

[tool.setuptools]
packages = [
    "cli",
    "core",
    "data",
    "config",
    "assets",
    "monitoring",
    "strategies",
    "observability",
    "utils",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
