[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "mcp-server"
version = "1.0.0"
dependencies = [
    "mcp>=1.2.0",
    "psycopg2-binary>=2.9.10",
    "google-genai>=1.38.0",
    "pgvector>=0.4.1",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.11.0",           # Data validation and settings
    "pydantic-settings>=2.11.0",  # Settings management from .env
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
]

[tool.ruff]
# Configuración ruff para mejores prácticas de formateo
line-length = 100  # Aumentar a 100 para strings largos
target-version = "py310"

[tool.ruff.lint]
# Seleccionar reglas importantes para código limpio
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
]

# Ignorar reglas específicas para strings largos descriptivos
ignore = [
    "E501",  # line-too-long (será manejado por formatter)
]

[tool.ruff.lint.per-file-ignores]
# Permitir líneas más largas en archivos específicos con strings descriptivos
"mcp_handlers/prompt_handlers.py" = ["E501"]
"tools/fuzzy_search.py" = ["E501"]
"server.py" = ["E501"]
"test/test_official_mcp_fixed.py" = ["E501"]

[tool.ruff.format]
# Configuración del formatter
quote-style = "double"
indent-style = "space"
line-ending = "auto"